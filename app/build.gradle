plugins {
    id 'com.android.application'
}

android {
    namespace 'com.virtual.cloner'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtual.cloner"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    
    // Public Virtual Core library (Accessible without 401 Unauthorized)
    implementation 'com.github.asLody:VirtualApp:v3.2.1'
}
